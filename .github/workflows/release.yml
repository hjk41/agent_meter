name: Build and publish release

on:
  push:
    tags: ['[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example 0.2.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  PYTHONUTF8: '1'

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            architecture: x64
            target: windows-x64
          - runner: macos-14
            architecture: arm64
            target: macos-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          architecture: ${{ matrix.architecture }}
          cache: pip
      - name: Validate version and install dependencies
        shell: bash
        run: |
          python tools/package_release.py --tag "$RELEASE_TAG" --check-version
          python -m pip install -r requirements.txt
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
          QT_LOGGING_RULES: '*.warning=false'
        run: python -m unittest discover -s tests -v
      - name: Build Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build.ps1
      - name: Build Apple Silicon application
        if: runner.os == 'macOS'
        shell: bash
        run: PYTHON=python sh build-macos.sh
      - name: Verify packaged application starts
        env:
          QT_QPA_PLATFORM: offscreen
          QT_LOGGING_RULES: '*.warning=false'
        run: python tools/verify_release.py
      - name: Package application and licenses
        shell: bash
        run: python tools/package_release.py --tag "$RELEASE_TAG" --target "${{ matrix.target }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-${{ matrix.target }}
          path: release-assets/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish verified download packages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Validate both archives and produce checksums
        run: python tools/package_release.py --tag "$RELEASE_TAG" --checksums-only
      - name: Create draft, upload both packages, then publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          notes="docs/releases/${RELEASE_TAG}.md"
          if [ ! -f "$notes" ]; then
            printf 'Agent Meter %s\n\nWindows x64 and Apple Silicon downloads. See README.md for setup.\n' "$RELEASE_TAG" > release-notes.md
            notes=release-notes.md
          fi
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json 2>/dev/null; then
            python -c 'import json; assert json.load(open("release-state.json"))["isDraft"], "Published releases are immutable; use a new version tag"'
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Agent Meter $RELEASE_TAG" --notes-file "$notes"
          fi
          gh release upload "$RELEASE_TAG" \
            "release-assets/AgentMeter-${RELEASE_TAG}-windows-x64.zip" \
            "release-assets/AgentMeter-${RELEASE_TAG}-macos-arm64.zip" \
            release-assets/SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest --notes-file "$notes"
          gh release view "$RELEASE_TAG" --json url,assets
